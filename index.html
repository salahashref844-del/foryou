
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Surprise For You! 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Central Button */
        #surprise-btn {
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background-color: #ff4b6e;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(255, 75, 110, 0.3);
            transition: all 0.3s ease;
            z-index: 10;
        }

        #surprise-btn:hover {
            background-color: #ff2a55;
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(255, 42, 85, 0.4);
        }

        #surprise-btn:active {
            transform: translateY(1px);
        }

        /* Surprise Card */
        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 320px;
            transform: scale(0);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: absolute;
            z-index: 10;
        }

        .card.show {
            transform: scale(1);
            opacity: 1;
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .message-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
        }

        /* Pulsing Heart Animation */
        .heart-icon {
            color: #ff4b6e;
            font-size: 1.8rem;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.3);
            }
        }

        /* Floating Hearts Background Effect */
        .floating-heart {
            position: absolute;
            bottom: -20px;
            color: rgba(83, 4, 20, 0.946);
            font-size: 1.5rem;
            animation: riseUp 4s linear infinite;
            user-select: none;
            pointer-events: none;
        }

        @keyframes riseUp {
            0% {
                transform: translateY(0) scale(0.6) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-105vh) scale(1.4) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Central Button -->
    <button id="surprise-btn">Click for a Surprise! 💝</button>

    <!-- Surprise Card -->
    <div class="card" id="surprise-card">
        <img src="https://www.bing.com/th/id/OIP.JSapKiQrrGAGfzVuIazHmgHaHa?w=193&h=193&c=8&rs=1&qlt=90&o=6&dpr=1.3&pid=ImgAns&rm=2">
            <span>I love you</span>
            <span class="heart-icon">❤️</span>
        </div>
    </div>

    <script>
        const btn = document.getElementById('surprise-btn');
        const card = document.getElementById('surprise-card');

        btn.addEventListener('click', () => {
            // Hide the button smoothly
            btn.style.transform = 'scale(0)';
            btn.style.opacity = '0';
            setTimeout(() => {
                btn.style.display = 'none';
            }, 300);

            // Reveal the surprise card with animation
            card.classList.add('show');

            // Start floating hearts effect
            startFloatingHearts();
        });

        function startFloatingHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('floating-heart');
                heart.innerHTML = '❤️';
                
                // Random horizontal positioning and animation duration variation
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                heart.style.fontSize = (Math.random() * 1 + 1) + 'rem';
                
                document.body.appendChild(heart);

                // Clean up elements after animation finishes
                setTimeout(() => {
                    heart.remove();
                }, 4000);
            }, 300);
        }
    </script>
</body>
</html>
