<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الأسئلة التفاعلية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #64085e, #e2158d, #9f2b40);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }

        .container {
            background-color: rgba(72, 12, 18, 0.85);
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 500px;
            text-align: center;
            border: 1px solid rgba(105, 9, 9, 0.3);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            margin-bottom: 25px;
            color: #f3e5ab;
            font-size: 1.5rem;
            line-height: 1.6;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background-color: #560530;
            color: #fff;
            border: 2px solid #a67c52;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-btn:hover {
            background-color: #8c582d;
            border-color: #f3e5ab;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .option-btn.wrong {
            background-color: #a93226;
            border-color: #e74c3c;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .hidden {
            display: none;
        }

        .win-screen h1 {
            color: #f3e5ab;
            font-size: 1.8rem;
            margin-bottom: 20px;
            line-height: 1.8;
        }

        .heart {
            font-size: 4rem;
            color: #e74c3c;
            animation: pulse 1.2s infinite ease-in-out;
            margin-top: 15px;
            display: inline-block;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        .progress {
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #d2b48c;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container" id="game-container">
        <div class="progress" id="progress-indicator">السؤال 1 من 8</div>
        <h2 id="question-text">جاري تحميل السؤال...</h2>
        <div class="options" id="options-container"></div>
    </div>

    <script>
        const questions = [
            {
                question: "إيه هو لونك المفضل؟",
                options: ["بني", "أزرق", "أسود"],
                answer: "بني"
            },
            {
                question: "إيه هي أكلتك المفضلة؟",
                options: ["بيتزا", "شاورما", "برجر"],
                answer: "شاورما"
            },
            {
                question: "إيه أكتر هدف بتتمني تحققيه؟",
                options: ["مهندسة", "دكتورة", "محامية"],
                answer: "دكتورة"
            },
            {
                question: "إيه أكتر فصل من فصول السنة بتحبيه؟",
                options: ["صيف", "شتاء", "خريف"],
                answer: "خريف"
            },
            {
                question: "إيه هو مشروبك المفضل؟",
                options: ["مانجو", "جوافة", "فراولة"],
                answer: "جوافة"
            },
            {
                question: "لو هتسافري مكان بتحبيه هتبقي عايزة مين معاكي؟",
                options: ["صلاح", "هاجر", "منه"],
                answer: "صلاح"
            },
            {
                question: "من هو مطربك المفضل؟",
                options: ["عمرو دياب", "تامر حسني", "أمير عيد"],
                answer: "أمير عيد"
            },
            {
                question: "إيه هو تاريخ ميلادك؟",
                options: ["20/4/2006", "15/5/2005", "10/3/2007"],
                answer: "20/4/2006"
            }
        ];

        let currentQuestionIndex = 0;

        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const progressIndicator = document.getElementById("progress-indicator");
        const gameContainer = document.getElementById("game-container");

        function loadQuestion() {
            if (currentQuestionIndex < questions.length) {
                progressIndicator.textContent = `السؤال ${currentQuestionIndex + 1} من ${questions.length}`;
                const currentQ = questions[currentQuestionIndex];
                questionText.textContent = currentQ.question;
                optionsContainer.innerHTML = "";

                currentQ.options.forEach(option => {
                    const btn = document.createElement("button");
                    btn.classList.add("option-btn");
                    btn.textContent = option;
                    btn.onclick = () => checkAnswer(option, btn);
                    optionsContainer.appendChild(btn);
                });
            } else {
                showWinScreen();
            }
        }

        function checkAnswer(selectedOption, buttonElement) {
            const currentQ = questions[currentQuestionIndex];
            if (selectedOption === currentQ.answer) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                buttonElement.classList.add("wrong");
                setTimeout(() => {
                    buttonElement.classList.remove("wrong");
                }, 400);
            }
        }

        function showWinScreen() {
            gameContainer.innerHTML = `
                <div class="win-screen">
                    <h1>مبروك يا دكتورة قلبي إنتي عارفة كل حاجة عن نفسك صح، بس الأصح إنك تكوني عارفة إن وجودك في حياتي هو اللي ماليها حب وفخر</h1>
                    <div class="heart">❤️</div>
                </div>
            `;
        }

        // تشغيل اللعبة لأول مرة
        loadQuestion();
    </script>
</body>
</html>
